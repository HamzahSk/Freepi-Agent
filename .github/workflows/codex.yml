name: Codex DB Fixer

on:
  workflow_dispatch:
    inputs:
      abi:
        description: "Target ABI for APK build"
        required: false
        default: "arm64-v8a"
        type: choice
        options:
          - arm64-v8a
          - armeabi-v7a
          - x86_64
      build_apk:
        description: "Build release APK after Codex run"
        required: false
        default: true
        type: boolean
  push:
    paths:
      - "prompt.md"

concurrency:
  group: codex-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CODEX_CLI_VERSION: "0.166.0"
  CODEX_MAX_ATTEMPTS: "5"
  CODEX_ATTEMPT_TIMEOUT_MINUTES: "45"
  CODEX_RETRY_BASE_SECONDS: "15"
  CODEX_RETRY_MAX_SECONDS: "120"

jobs:
  codex-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    env:
      XINGCHIAPI_API_KEY: ${{ secrets.XINGCHIAPI_API_KEY }}
      CODEX_BASE_SHA: ${{ github.sha }}

    steps:
      - name: Initialize runner temp paths
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "CODEX_HOME=$RUNNER_TEMP/codex-home" >> "$GITHUB_ENV"
          echo "CODEX_RECOVERY_DIR=$RUNNER_TEMP/codex-recovery" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore Codex session cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CODEX_HOME }}
          key: codex-session-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            codex-session-${{ github.run_id }}-

      - name: Restore worktree checkpoint
        shell: bash
        run: |
          set -Eeuo pipefail
          checkpoint_dir="$CODEX_HOME/recovery-checkpoint"

          if [[ -s "$checkpoint_dir/base-sha.txt" ]]; then
            checkpoint_base="$(<"$checkpoint_dir/base-sha.txt")"
            if [[ "$checkpoint_base" != "$GITHUB_SHA" ]]; then
              echo "::error::Recovery checkpoint belongs to $checkpoint_base, not $GITHUB_SHA"
              exit 1
            fi
          fi

          if [[ -s "$checkpoint_dir/worktree.patch" ]]; then
            git apply --check --binary "$checkpoint_dir/worktree.patch"
            git apply --binary "$checkpoint_dir/worktree.patch"
            echo "Restored tracked-file progress from the previous workflow attempt."
          fi

          if [[ -s "$checkpoint_dir/untracked-files.tar.gz" ]]; then
            tar -xzf "$checkpoint_dir/untracked-files.tar.gz"
            echo "Restored untracked-file progress from the previous workflow attempt."
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Codex CLI
        shell: bash
        run: |
          set -Eeuo pipefail
          for attempt in 1 2 3; do
            if timeout 5m npm install --global "@openai/codex@$CODEX_CLI_VERSION"; then
              exit 0
            fi
            if (( attempt < 3 )); then
              sleep $((attempt * 10))
            fi
          done
          echo "::error::Unable to install Codex CLI after three attempts"
          exit 1

      - name: Configure Codex
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -z "${XINGCHIAPI_API_KEY:-}" ]]; then
            echo "::error::Repository secret XINGCHIAPI_API_KEY is required"
            exit 1
          fi

          mkdir -p "$CODEX_HOME"

          cat > "$CODEX_HOME/config.toml" <<'EOF'
          model = "gpt-6.1-sol"
          model_provider = "agentrouter"

          [model_providers.agentrouter]
          name = "AgentRouter"
          base_url = "https://api.xingchiapi.com/v1"
          wire_api = "responses"
          env_key = "XINGCHIAPI_API_KEY"
          request_max_retries = 6
          stream_max_retries = 10
          stream_idle_timeout_ms = 300000
          EOF

      - name: Check Codex recovery support
        shell: bash
        run: |
          set -Eeuo pipefail
          codex --version
          codex exec resume --help >/dev/null

      - name: Run Codex with session recovery
        shell: bash
        run: |
          echo "Available repository:"
          echo "Main: $GITHUB_WORKSPACE"

          bash .github/scripts/run-codex-with-recovery.sh prompt.md

      - name: Collect changed files and recovery diagnostics
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$CODEX_HOME"
          git add -A

          mkdir -p output_artifact codex_diagnostics
          : > output_artifact/deleted_files.txt

          while IFS= read -r -d '' file; do
            if [[ -e "$file" || -L "$file" ]]; then
              mkdir -p "output_artifact/$(dirname "$file")"
              cp -a "$file" "output_artifact/$file"
            else
              printf '%s\n' "$file" >> output_artifact/deleted_files.txt
            fi
          done < <(git diff --cached --name-only -z)

          if [[ -d "$CODEX_RECOVERY_DIR" ]]; then
            cp -a "$CODEX_RECOVERY_DIR/." codex_diagnostics/
          fi

          if [[ -d "$CODEX_HOME/sessions" ]]; then
            mkdir -p codex_diagnostics/sessions
            cp -a "$CODEX_HOME/sessions/." codex_diagnostics/sessions/
          fi

          if [[ -d "$CODEX_HOME/recovery-checkpoint" ]]; then
            mkdir -p codex_diagnostics/recovery-checkpoint
            cp -a "$CODEX_HOME/recovery-checkpoint/." codex_diagnostics/recovery-checkpoint/
          fi

      - name: Save Codex session cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CODEX_HOME }}
          key: codex-session-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload Codex changes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-output-${{ github.sha }}-${{ github.run_attempt }}
          path: output_artifact/
          retention-days: 14

      - name: Upload Codex recovery diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-recovery-${{ github.sha }}-${{ github.run_attempt }}
          path: codex_diagnostics/
          if-no-files-found: warn
          retention-days: 7

  build-apk:
    name: Build APK (${{ inputs.abi || 'arm64-v8a' }})
    needs: codex-run
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && (inputs.build_apk == true || inputs.build_apk == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    env:
      ABI: ${{ inputs.abi || 'arm64-v8a' }}
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Codex changes
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: codex-output-${{ github.sha }}-${{ github.run_attempt }}
          path: .codex-changes

      - name: Apply Codex file changes
        run: |
          set -euo pipefail
          if [ -d ".codex-changes" ]; then
            echo "Applying modified/added files from Codex output..."
            find .codex-changes -mindepth 1 ! -name 'deleted_files.txt' -exec cp -a -t . {} +
          fi

          if [ -s ".codex-changes/deleted_files.txt" ]; then
            echo "Removing files listed in deleted_files.txt..."
            while IFS= read -r rel_path || [ -n "$rel_path" ]; do
              rel_path="${rel_path#"${rel_path%%[![:space:]]*}"}"
              rel_path="${rel_path%"${rel_path##*[![:space:]]}"}"
              [ -n "$rel_path" ] || continue
              rm -rf "$rel_path"
              echo "Deleted: $rel_path"
            done < ".codex-changes/deleted_files.txt"
          fi

          rm -rf .codex-changes

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36"

      - name: Decode CI keystore (optional)
        if: env.KEYSTORE_BASE64 != ''
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing/release.jks"
          {
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/signing/release.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}"
            echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}"
          } >> "$GITHUB_ENV"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build release APK
        run: |
          ./gradlew --no-daemon --stacktrace :app:assembleRelease -Pabis="$ABI"

      - name: Collect APK
        id: apk
        run: |
          set -euo pipefail
          OUT=app/build/outputs/apk/release
          echo "--- built files ---"
          find "$OUT" -name '*.apk' -printf '%f  %s bytes\n' | sort

          APK=$(find "$OUT" -name "*${ABI}*.apk" | head -1 || true)
          if [ -z "$APK" ]; then
            APK=$(find "$OUT" -name '*.apk' ! -name '*unsigned*' | head -1 || true)
          fi
          [ -n "$APK" ] || { echo "::error::no APK produced"; exit 1; }

          mkdir -p dist
          NAME="rolang-${ABI}.apk"
          cp "$APK" "dist/$NAME"

          SIZE_MB=$(( $(stat -c%s "dist/$NAME") / 1024 / 1024 ))
          {
            echo "name=$NAME"
            echo "size_mb=$SIZE_MB"
            echo "sha256=$(sha256sum "dist/$NAME" | cut -d' ' -f1)"
          } | tee -a "$GITHUB_OUTPUT"

      - name: Verify APK
        run: |
          set -euo pipefail
          APK="dist/${{ steps.apk.outputs.name }}"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -1)
          if [ -z "$BT" ]; then echo "::warning::no build-tools, skipping verification"; exit 0; fi
          "$BT/apksigner" verify --print-certs "$APK" | head -20 || true
          echo "--- package ---"
          "$BT/aapt2" dump badging "$APK" | grep -E "package:|sdkVersion|targetSdkVersion|native-code" || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rolang-${{ env.ABI }}
          path: dist/${{ steps.apk.outputs.name }}
          if-no-files-found: error
          retention-days: 30

      - name: APK Summary
        run: |
          {
            echo "### APK ready"
            echo
            echo "| item | value |"
            echo "| --- | --- |"
            echo "| artifact | \`${{ steps.apk.outputs.name }}\` |"
            echo "| abi | \`${{ env.ABI }}\` |"
            echo "| size | ${{ steps.apk.outputs.size_mb }} MB |"
            echo "| sha256 | \`${{ steps.apk.outputs.sha256 }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
