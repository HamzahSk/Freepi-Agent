name: Android APK

# Builds the free-pi stream (Lk21) Android app and publishes an installable
# arm64-v8a APK as a workflow artifact, so it can be downloaded straight from
# the run page (Actions -> run -> Artifacts).
#
# Push to main / open a PR  -> build + upload artifact
# Push a v* tag             -> build + upload artifact + attach to the Release
# Manual run               -> same as push, ABI is selectable

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      abi:
        description: "ABI target"
        type: choice
        options: [arm64-v8a, universal, armeabi-v7a, x86_64]
        default: arm64-v8a

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK (${{ github.event.inputs.abi || 'arm64-v8a' }})
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      ABI: ${{ github.event.inputs.abi || 'arm64-v8a' }}
      # Empty unless the repo has the optional signing secrets (see README).
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # gradle.properties pins org.gradle.java.home to the runner's Temurin 17.
      # Drop that pin if the image does not ship it, otherwise Gradle refuses to start.
      - name: Use a JDK that exists on the runner
        run: |
          PIN="/usr/lib/jvm/temurin-17-jdk-amd64"
          if [ ! -d "$PIN" ]; then
            echo "::warning::$PIN missing, using JAVA_HOME instead"
            sed -i '/org\.gradle\.java\.home/d' gradle.properties
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36"

      - name: Decode CI keystore (optional)
        if: env.KEYSTORE_BASE64 != ''
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing/release.jks"
          {
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/signing/release.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}"
            echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}"
          } >> "$GITHUB_ENV"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build release APK
        run: |
          ./gradlew --no-daemon --stacktrace :app:assembleRelease -Pabis="$ABI"

      - name: Unit tests
        # Informational only: the release build already succeeded, so a network
        # dependent test must not throw away a good APK.
        continue-on-error: true
        run: ./gradlew --no-daemon :app:testReleaseUnitTest -Pabis="$ABI"

      - name: Collect APK
        id: apk
        run: |
          set -euo pipefail
          OUT=app/build/outputs/apk/release
          echo "--- built files ---"
          find "$OUT" -name '*.apk' -printf '%f  %s bytes\n' | sort

          # Prefer the ABI split APK; fall back to whatever single APK exists
          # (AGP emits a universal APK when the project has no native libs).
          APK=$(find "$OUT" -name "*arm64-v8a*.apk" | head -1 || true)
          if [ -z "$APK" ]; then
            APK=$(find "$OUT" -name '*.apk' ! -name '*unsigned*' | head -1 || true)
          fi
          [ -n "$APK" ] || { echo "::error::no APK produced"; exit 1; }

          mkdir -p dist
          SUFFIX="$ABI"
          [ "$ABI" = "universal" ] && SUFFIX="universal"
          NAME="freepi-stream-${SUFFIX}.apk"
          cp "$APK" "dist/$NAME"

          SIZE_MB=$(( $(stat -c%s "dist/$NAME") / 1024 / 1024 ))
          {
            echo "name=$NAME"
            echo "size_mb=$SIZE_MB"
            echo "sha256=$(sha256sum "dist/$NAME" | cut -d' ' -f1)"
          } | tee -a "$GITHUB_OUTPUT"

      - name: Verify the APK is signed and declares the right ABI
        run: |
          set -euo pipefail
          APK="dist/${{ steps.apk.outputs.name }}"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -1)
          if [ -z "$BT" ]; then echo "::warning::no build-tools, skipping verification"; exit 0; fi
          "$BT/apksigner" verify --print-certs "$APK" | head -20
          echo "--- package ---"
          "$BT/aapt2" dump badging "$APK" | grep -E "package:|sdkVersion|targetSdkVersion|native-code" || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: freepi-stream-${{ env.ABI }}
          path: dist/${{ steps.apk.outputs.name }}
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ steps.apk.outputs.name }}
          generate_release_notes: true
          body: |
            Installable Android build of free-pi stream.

            - ABI: `${{ env.ABI }}`
            - Size: ${{ steps.apk.outputs.size_mb }} MB
            - SHA-256: `${{ steps.apk.outputs.sha256 }}`

            Sideload it (Settings -> allow install from this source), or
            `adb install -r ${{ steps.apk.outputs.name }}`.
          fail_on_unmatched_files: true

      - name: Summary
        run: |
          {
            echo "### APK ready"
            echo
            echo "| item | value |"
            echo "| --- | --- |"
            echo "| artifact | \`${{ steps.apk.outputs.name }}\` |"
            echo "| abi | \`${{ env.ABI }}\` |"
            echo "| size | ${{ steps.apk.outputs.size_mb }} MB |"
            echo "| sha256 | \`${{ steps.apk.outputs.sha256 }}\` |"
            echo
            echo "Download it from the **Artifacts** section of this run."
          } >> "$GITHUB_STEP_SUMMARY"
