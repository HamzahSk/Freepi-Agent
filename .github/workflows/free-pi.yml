name: free-pi
run-name: free-pi · ${{ inputs.model || 'particle' }} · ${{ github.event_name == 'push' && 'prompt.md' || 'manual' }}

# Run free-pi's models from GitHub Actions. The sign-in token lives in the repo
# secret FREEPI_TOKEN, so nothing is committed.
#
# Setup, once, in a terminal:
#   gh secret set FREEPI_TOKEN --body "$(node -e 'console.log(JSON.parse(require("fs").readFileSync(process.env.HOME+"/.free-pi/agent/credentials.json","utf8")).token)')"
# More detail: .github/free-pi/SETUP.md
#
# Why `pi` and not `free-pi-cli`: the free-pi CLI is an interactive terminal app
# (no --print mode, it always opens the TUI), so it cannot run unattended. This
# workflow therefore runs the same agent binary free-pi is built on, pointed at
# free-pi's OpenAI-compatible endpoint (https://api.freepi.ai/v1) with your token.
# Same models, same daily allowance, real headless output.

on:
  # Auto-run whenever prompt.md changes on any branch. The file's contents become
  # the prompt, so editing prompt.md is how you drive the agent.
  push:
    paths:
      - prompt.md
  workflow_dispatch:
    inputs:
      prompt:
        description: Prompt override (leave empty to use prompt.md)
        type: string
        required: false
        default: ""
      model:
        description: free-pi model id
        type: string
        required: false
        default: particle
      thinking:
        description: Thinking level
        type: choice
        options: [off, low, medium, high]
        default: medium
      tools:
        description: Tool allowlist, comma separated (empty = pi defaults)
        type: string
        required: false
        default: ""
      mode:
        description: Output mode
        type: choice
        options: [text, json]
        default: text
      build_apk:
        description: Build Android APK after agent run
        type: boolean
        required: false
        default: true
      abi:
        description: ABI target for APK build
        type: choice
        options: [arm64-v8a, universal, armeabi-v7a, x86_64]
        default: arm64-v8a

  workflow_call:
    inputs:
      prompt:
        type: string
        required: true
      model:
        type: string
        required: false
        default: particle
      thinking:
        type: string
        required: false
        default: medium
      tools:
        type: string
        required: false
        default: ""
      mode:
        type: string
        required: false
        default: text
      build_apk:
        type: boolean
        required: false
        default: false
      abi:
        type: string
        required: false
        default: arm64-v8a
    secrets:
      FREEPI_TOKEN:
        required: true

permissions:
  contents: read

# One run at a time per branch: the daily allowance is shared with your terminal.
# A new prompt.md commit cancels the run still working on the older prompt.
concurrency:
  group: free-pi-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  PI_SKIP_VERSION_CHECK: "1"
  PI_TELEMETRY: "0"
  NO_COLOR: "1"
  CI: "true"

jobs:
  free-pi:
    name: free-pi ${{ inputs.model || 'particle' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"

      - name: Install pi
        run: |
          npm install -g --ignore-scripts @earendil-works/pi-coding-agent@latest
          pi --version

      - name: Configure the free-pi provider
        env:
          FREEPI_TOKEN: ${{ secrets.FREEPI_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${FREEPI_TOKEN:-}" ]; then
            echo "::error::Secret FREEPI_TOKEN is missing. See .github/free-pi/SETUP.md"
            exit 1
          fi
          # Mask the token before any command could echo it.
          echo "::add-mask::${FREEPI_TOKEN}"
          mkdir -p "$HOME/.pi/agent"
          install -m 600 .github/free-pi/models.json "$HOME/.pi/agent/models.json"
          node .github/free-pi/account.mjs

      - name: Run the agent
        env:
          FREEPI_TOKEN: ${{ secrets.FREEPI_TOKEN }}
          INPUT_PROMPT: ${{ inputs.prompt }}
          INPUT_MODEL: ${{ inputs.model || 'particle' }}
          INPUT_THINKING: ${{ inputs.thinking || 'medium' }}
          INPUT_TOOLS: ${{ inputs.tools }}
          INPUT_MODE: ${{ inputs.mode || 'text' }}
        run: |
          set -euo pipefail
          ext=txt
          args=(--model "free-pi/${INPUT_MODEL}" --thinking "$INPUT_THINKING" --no-approve)
          if [ -n "${INPUT_TOOLS}" ]; then
            args+=(--tools "$INPUT_TOOLS")
          fi
          if [ "${INPUT_MODE}" = "json" ]; then
            args+=(--mode json)
            ext=jsonl
          fi

          # Prompt resolution: dispatch input wins, otherwise prompt.md.
          prompt="${INPUT_PROMPT:-}"
          if [ -z "$prompt" ]; then
            if [ ! -s prompt.md ]; then
              echo "::error::No prompt given and prompt.md is missing or empty."
              exit 1
            fi
            prompt="$(cat prompt.md)"
            echo "Using prompt.md ($(wc -c < prompt.md) bytes)"
          fi
          if [ "${#prompt}" -gt 100000 ]; then
            echo "::error::Prompt is larger than 100000 characters; split it or pass a shorter prompt."
            exit 1
          fi

          pi --print "$prompt" "${args[@]}" | tee "free-pi-output.${ext}"
          if [ -s "free-pi-output.${ext}" ]; then
            {
              echo "### free-pi / ${INPUT_MODEL}"
              echo
              echo '````'
              cat "free-pi-output.${ext}"
              echo '````'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Collect changed files
        if: always()
        run: |
          set -euo pipefail
          python3 .github/free-pi/changed-files.py free-pi-changes || {
            echo "::warning::Could not collect the agent's file changes"
            mkdir -p free-pi-changes
            : > free-pi-changes/deleted-files.txt
            : > free-pi-changes/changed-files.txt
          }
          {
            echo "### Files changed by free-pi"
            echo
            if [ -s free-pi-changes/changed-files.txt ]; then
              echo '````'
              cat free-pi-changes/changed-files.txt
              echo '````'
            else
              echo "_No file changes._"
            fi
            echo
            echo "### Deleted files"
            echo
            if [ -s free-pi-changes/deleted-files.txt ]; then
              echo '````'
              cat free-pi-changes/deleted-files.txt
              echo '````'
            else
              echo "_Nothing deleted._"
            fi
            echo
            echo "Download the changed files from the **free-pi-changes** artifact (folder \`files/\`)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show remaining allowance
        if: always()
        env:
          FREEPI_TOKEN: ${{ secrets.FREEPI_TOKEN }}
        run: node .github/free-pi/account.mjs || true

      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: free-pi-output
          path: free-pi-output.*
          if-no-files-found: warn

      # The agent's edits, with the same folder layout, plus the list of files it
      # deleted (deleted-files.txt). Empty runs still upload the two .txt files.
      - name: Upload changed files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: free-pi-changes
          path: free-pi-changes/
          if-no-files-found: warn

  build-apk:
    name: Build APK (${{ inputs.abi || 'arm64-v8a' }})
    needs: free-pi
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.build_apk) ||
      (github.event_name == 'workflow_call' && inputs.build_apk)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      ABI: ${{ inputs.abi || 'arm64-v8a' }}
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download agent changes
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: free-pi-changes
          path: .agent-changes

      - name: Apply agent file changes
        run: |
          set -euo pipefail
          if [ -d ".agent-changes/files" ]; then
            echo "Applying modified/added files from free-pi-changes/files/..."
            cp -r .agent-changes/files/. .
          fi

          if [ -s ".agent-changes/deleted-files.txt" ]; then
            echo "Removing files listed in deleted-files.txt..."
            while IFS= read -r rel_path || [ -n "$rel_path" ]; do
              rel_path="${rel_path#"${rel_path%%[![:space:]]*}"}"
              rel_path="${rel_path%"${rel_path##*[![:space:]]}"}"
              [ -n "$rel_path" ] || continue
              rm -rf "$rel_path"
              echo "Deleted: $rel_path"
            done < ".agent-changes/deleted-files.txt"
          fi

          rm -rf .agent-changes

      - name: Use a JDK that exists on the runner
        run: |
          PIN="/usr/lib/jvm/temurin-17-jdk-amd64"
          if [ ! -d "$PIN" ]; then
            echo "::warning::$PIN missing, using JAVA_HOME instead"
            sed -i '/org\.gradle\.java\.home/d' gradle.properties
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36"

      - name: Decode CI keystore (optional)
        if: env.KEYSTORE_BASE64 != ''
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing/release.jks"
          {
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/signing/release.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}"
            echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}"
          } >> "$GITHUB_ENV"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build release APK
        run: |
          ./gradlew --no-daemon --stacktrace :app:assembleRelease -Pabis="$ABI"

      - name: Collect APK
        id: apk
        run: |
          set -euo pipefail
          OUT=app/build/outputs/apk/release
          echo "--- built files ---"
          find "$OUT" -name '*.apk' -printf '%f  %s bytes\n' | sort

          APK=$(find "$OUT" -name "*${ABI}*.apk" | head -1 || true)
          if [ -z "$APK" ]; then
            APK=$(find "$OUT" -name '*.apk' ! -name '*unsigned*' | head -1 || true)
          fi
          [ -n "$APK" ] || { echo "::error::no APK produced"; exit 1; }

          mkdir -p dist
          NAME="freepi-stream-${ABI}.apk"
          cp "$APK" "dist/$NAME"

          SIZE_MB=$(( $(stat -c%s "dist/$NAME") / 1024 / 1024 ))
          {
            echo "name=$NAME"
            echo "size_mb=$SIZE_MB"
            echo "sha256=$(sha256sum "dist/$NAME" | cut -d' ' -f1)"
          } | tee -a "$GITHUB_OUTPUT"

      - name: Verify APK
        run: |
          set -euo pipefail
          APK="dist/${{ steps.apk.outputs.name }}"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -1)
          if [ -z "$BT" ]; then echo "::warning::no build-tools, skipping verification"; exit 0; fi
          "$BT/apksigner" verify --print-certs "$APK" | head -20 || true
          echo "--- package ---"
          "$BT/aapt2" dump badging "$APK" | grep -E "package:|sdkVersion|targetSdkVersion|native-code" || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: freepi-stream-${{ env.ABI }}
          path: dist/${{ steps.apk.outputs.name }}
          if-no-files-found: error
          retention-days: 30

      - name: APK Summary
        run: |
          {
            echo "### APK ready"
            echo
            echo "| item | value |"
            echo "| --- | --- |"
            echo "| artifact | \`${{ steps.apk.outputs.name }}\` |"
            echo "| abi | \`${{ env.ABI }}\` |"
            echo "| size | ${{ steps.apk.outputs.size_mb }} MB |"
            echo "| sha256 | \`${{ steps.apk.outputs.sha256 }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
